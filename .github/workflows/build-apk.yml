name: Build Pop Surprise APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Python
      # -------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # -------------------------------------------------
      # Java
      # -------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -------------------------------------------------
      # Linux dependencies
      # -------------------------------------------------

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip


      # -------------------------------------------------
      # Buildozer
      # Don't use latest blindly
      # -------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install "buildozer==1.5.0"

          echo "========== PYTHON =========="
          python --version

          echo "========== BUILDOZER =========="
          buildozer --version


      # -------------------------------------------------
      # Clean old build
      # -------------------------------------------------

      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.buildozer/android/platform/build-*


      # -------------------------------------------------
      # Build
      # -------------------------------------------------

      - name: Build Android APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log


      # -------------------------------------------------
      # Error output
      # -------------------------------------------------

      - name: Show build failure
        if: failure()
        run: |
          echo "========== BUILD FAILURE =========="

          grep -i -B 15 -A 40 \
            -E "BUILD FAILED|Command failed|CalledProcessError|ModuleNotFoundError|ImportError|ERROR:|FAILED:|fatal error:|No such file|not found|Could not|Execution failed" \
            build.log | tail -n 600 || true

          echo ""
          echo "========== LAST 300 LINES =========="

          tail -n 300 build.log || true


      # -------------------------------------------------
      # Upload log
      # -------------------------------------------------

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-Build-Log
          path: build.log
          if-no-files-found: warn


      # -------------------------------------------------
      # Find generated APK
      # -------------------------------------------------

      - name: Find APK
        if: success()
        run: |
          echo "========== APK FILES =========="
          find bin -type f -name "*.apk" -print


      # -------------------------------------------------
      # Upload APK
      # -------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-APK
          path: bin/*.apk
          if-no-files-found: error
