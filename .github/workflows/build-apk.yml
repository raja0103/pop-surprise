name: Build Pop Surprise APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip

      - name: Install latest Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer
          buildozer --version

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show actual errors
        if: failure()
        run: |
          echo "========== ACTUAL BUILD ERRORS =========="
          grep -i -B 15 -A 30 \
            -E "error:|failed|traceback|exception|undefined|fatal:" \
            build.log | tail -n 500 || true

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-Build-Log
          path: build.log

      - name: Find APK
        if: success()
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-APK
          path: bin/*.apk
          if-no-files-found: error