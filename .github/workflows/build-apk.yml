name: Build Pop Surprise APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0


    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. PYTHON 3.11
      # ==================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # 3. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 4. LINUX DEPENDENCIES
      # ==================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip


      # ==================================================
      # 5. BUILDOZER + CYTHON
      # ==================================================

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install "Cython==0.29.36"

          python -m pip install "buildozer==1.5.0"

          echo "================================="
          echo "PYTHON VERSION"
          echo "================================="

          python --version

          echo "================================="
          echo "CYTHON VERSION"
          echo "================================="

          cython --version

          echo "================================="
          echo "BUILDOZER VERSION"
          echo "================================="

          buildozer --version


      # ==================================================
      # 6. CLEAN PREVIOUS BUILD
      # ==================================================

      - name: Clean previous build
        run: |

          echo "Cleaning previous Android build..."

          rm -rf .buildozer
          rm -rf bin

          rm -rf ~/.buildozer/android/platform/build-*


      # ==================================================
      # 7. BUILD APK
      # ==================================================

      - name: Build Android APK
        run: |

          set -o pipefail

          echo "================================="
          echo "STARTING ANDROID BUILD"
          echo "================================="

          buildozer -v android debug 2>&1 | tee build.log


      # ==================================================
      # 8. SHOW ACTUAL ERROR
      # ==================================================

      - name: Show actual build errors
        if: failure()
        run: |

          echo "================================="
          echo "ACTUAL BUILD ERRORS"
          echo "================================="

          grep -i -B 15 -A 40 \
            -E "BUILD FAILED|Command failed|CalledProcessError|ModuleNotFoundError|ImportError|ERROR:|FAILED:|fatal error:|No such file|not found|Could not|Execution failed" \
            build.log | tail -n 600 || true

          echo ""
          echo "================================="
          echo "LAST 300 LINES"
          echo "================================="

          tail -n 300 build.log || true


      # ==================================================
      # 9. UPLOAD BUILD LOG WHEN FAILED
      # ==================================================

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:

          name: Pop-Surprise-Build-Log

          path: build.log

          if-no-files-found: warn


      # ==================================================
      # 10. FIND GENERATED APK
      # ==================================================

      - name: Find APK
        if: success()
        run: |

          echo "================================="
          echo "GENERATED APK"
          echo "================================="

          find bin -type f -name "*.apk" -print


      # ==================================================
      # 11. UPLOAD APK
      # ==================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: Pop-Surprise-APK

          path: bin/*.apk

          if-no-files-found: error
