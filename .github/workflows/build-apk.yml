name: Build Pop Surprise APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # HOST PYTHON
      # ==================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # JAVA
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # SYSTEM DEPENDENCIES
      # ==================================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip


      # ==================================================
      # BUILDOZER
      # ==================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

          echo "========================================"
          echo "HOST BUILD ENVIRONMENT"
          echo "========================================"

          which python
          python --version

          which pip
          pip --version

          cython --version
          buildozer --version


      # ==================================================
      # CLEAN EVERYTHING
      #
      # Important because previous build used Python 3.14.
      # We don't want any cp314 artifacts reused.
      # ==================================================

      - name: Clean old Android build
        run: |
          echo "Cleaning old Buildozer/p4a build..."

          rm -rf .buildozer
          rm -rf bin

          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/python-for-android

          echo "Clean completed."


      # ==================================================
      # SHOW CONFIG
      # ==================================================

      - name: Show Buildozer configuration
        run: |
          echo "========================================"
          echo "BUILDOZER SPEC REQUIREMENTS"
          echo "========================================"

          grep "^requirements" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ANDROID CONFIG"
          echo "========================================"

          grep "^android.api" buildozer.spec || true
          grep "^android.minapi" buildozer.spec || true
          grep "^android.archs" buildozer.spec || true


      # ==================================================
      # BUILD
      # ==================================================

      - name: Build Android APK
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING POP SURPRISE"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log


      # ==================================================
      # DEBUG TARGET PYTHON
      # ==================================================

      - name: Show Android Python version
        if: always()
        run: |
          echo "========================================"
          echo "ANDROID PYTHON CHECK"
          echo "========================================"

          find .buildozer \
            -type d \
            \( -name "python3.11" -o -name "python3.12" -o -name "python3.13" -o -name "python3.14" \) \
            -print 2>/dev/null || true

          echo ""
          echo "Checking for accidental Python 3.14 files..."

          find .buildozer \
            -iname "*cp314*" \
            -o -iname "*python3.14*" \
            2>/dev/null | head -n 100 || true


      # ==================================================
      # ERROR REPORT
      # ==================================================

      - name: Show actual build errors
        if: failure()
        run: |
          echo "========================================"
          echo "ACTUAL BUILD ERRORS"
          echo "========================================"

          grep -i -B 20 -A 50 \
            -E "BUILD FAILED|Command failed|CalledProcessError|ModuleNotFoundError|ImportError|ERROR:|FAILED:|fatal error:|No such file|not found|Could not|Execution failed|not a supported wheel" \
            build.log | tail -n 800 || true

          echo ""
          echo "========================================"
          echo "LAST 400 LINES"
          echo "========================================"

          tail -n 400 build.log || true


      # ==================================================
      # UPLOAD LOG ON FAILURE
      # ==================================================

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-Build-Log
          path: build.log
          if-no-files-found: warn


      # ==================================================
      # FIND APK
      # ==================================================

      - name: Find generated APK
        if: success()
        run: |
          echo "========================================"
          echo "GENERATED APK"
          echo "========================================"

          find bin -type f -name "*.apk" -print


      # ==================================================
      # UPLOAD APK
      # ==================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-APK
          path: bin/*.apk
          if-no-files-found: error
