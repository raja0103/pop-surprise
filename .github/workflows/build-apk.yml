name: Build Pop Surprise APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython


      - name: Build Android APK
        run: |
          buildozer android debug


      - name: Show generated files
        if: always()
        run: |
          echo "BIN DIRECTORY"
          ls -lah bin/ || true


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pop-Surprise-APK
          path: bin/*.apk